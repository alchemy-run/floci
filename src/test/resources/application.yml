quarkus:
  http:
    port: 0
    test-port: 0
    limits:
      max-body-size: ${floci.max-request-size}M
  datasource:
    active: false

floci:
  base-url: "http://localhost:4566"
  default-region: us-east-1
  default-account-id: "000000000000"
  storage:
    mode: memory
    persistent-path: ./target/test-data
    prune-volumes-on-delete: true
    wal:
      compaction-interval-ms: 60000
    services:
      ssm:
        flush-interval-ms: 60000
      dynamodb:
        flush-interval-ms: 60000
      sns:
        flush-interval-ms: 60000
      lambda:
        flush-interval-ms: 60000
      cloudwatchlogs:
        flush-interval-ms: 60000
      cloudwatchmetrics:
        flush-interval-ms: 60000
      secretsmanager:
        flush-interval-ms: 60000
      acm:
        flush-interval-ms: 60000
      opensearch:
        flush-interval-ms: 60000
      batch:
        flush-interval-ms: 60000
      lightsail:
        flush-interval-ms: 60000
      codepipeline:
        flush-interval-ms: 60000
      codeconnections:
        flush-interval-ms: 60000
      s3vectors:
        flush-interval-ms: 60000
      ecs:
        flush-interval-ms: 60000
      codebuild:
        flush-interval-ms: 60000
      config:
        flush-interval-ms: 60000
      transcribe:
        flush-interval-ms: 60000
      codedeploy:
        flush-interval-ms: 60000
      tagging:
        flush-interval-ms: 60000
      elasticbeanstalk:
        flush-interval-ms: 60000
      cloudfront:
      appsync:
        flush-interval-ms: 60000
      rum:
        flush-interval-ms: 60000
      amp:
        flush-interval-ms: 60000
      aiops:
        flush-interval-ms: 60000
      account:
        flush-interval-ms: 60000
      accessanalyzer:
        flush-interval-ms: 60000
      backupsearch:
        flush-interval-ms: 60000
      databrew:
        flush-interval-ms: 60000
      dlm:
        flush-interval-ms: 60000
      auditmanager:
        flush-interval-ms: 60000
      amplify:
        flush-interval-ms: 60000
      appflow:
        flush-interval-ms: 60000
      appintegrations:
        flush-interval-ms: 60000
      appregistry:
        flush-interval-ms: 60000
      apprunner:
        flush-interval-ms: 60000
      b2bi:
        flush-interval-ms: 60000
      chatbot:
        flush-interval-ms: 60000
      controltower:
        flush-interval-ms: 60000
      codeartifact:
        flush-interval-ms: 60000
      application-signals:
        flush-interval-ms: 60000
      bedrock-agent:
        flush-interval-ms: 60000
      bedrock-agent-core:
        flush-interval-ms: 60000
      bedrock-data-automation:
        flush-interval-ms: 60000

  auth:
    validate-signatures: false
    presign-secret: test-secret

  security:
    disable-cors-headers: false

  init-hooks:
    shell-executable: /bin/sh
    timeout-seconds: 5
    shutdown-grace-period-seconds: 2

  tls:
    enabled: false
    self-signed: true

  protocols:
    strict-claiming: false
    reject-unknown-service-scope: true

  docker:
    log-max-size: "10m"
    log-max-file: "3"
    resource-namespace: ""

  services:
    ssm:
      enabled: true
      max-parameter-history: 5
    sqs:
      enabled: true
      default-visibility-timeout: 30
      max-message-size: 1048576
    s3:
      enabled: true
      enforce-auth: false
      default-presign-expiry-seconds: 3600
    dynamodb:
      enabled: true
    dms:
      enabled: true
    sns:
      enabled: true
    lambda:
      enabled: true
      # aws-config-path:
      hot-reload:
        enabled: true
    apigateway:
      enabled: true
    apigatewayv2:
      enabled: true
    iam:
      enabled: true
      enforcement-enabled: false
      seed-deployer-principal: false
    msk:
      enabled: true
      mock: true
      default-image: "redpandadata/redpanda:latest"
    amazonmq:
      enabled: true
      mock: true
    kinesis-analytics:
      enabled: true
      mock: true
    elasticache:
      enabled: true
      proxy-base-port: 6379
      proxy-max-port: 6399
      default-image: "valkey/valkey:8"
      default-memcached-image: "memcached:1.6"
    memorydb:
      enabled: true
      mock: false
      proxy-base-port: 6400
      proxy-max-port: 6419
      default-image: "valkey/valkey:8"
    dax:
      enabled: true
    rds:
      enabled: true
      mock: false
      proxy-base-port: 7001
      proxy-max-port: 7099
      default-postgres-image: "postgres:16-alpine"
      default-mysql-image: "mysql:8.0"
      default-mariadb-image: "mariadb:11"
    rds-data:
      enabled: true
      transaction-ttl-seconds: 180
    neptune:
      enabled: true
      proxy-base-port: 8182
      proxy-max-port: 8282
      default-image: "tinkerpop/gremlin-server:3.7.3"
    eventbridge:
      enabled: true
    cloudmap:
      enabled: true
    emr:
      enabled: true
    wafv2:
      enabled: true
    scheduler:
      enabled: true
    cloudwatchlogs:
      enabled: true
      max-events-per-query: 10000
    cloudwatchmetrics:
      enabled: true
    secretsmanager:
      enabled: true
      default-recovery-window-days: 30
    kinesis:
      enabled: true
    firehose:
      enabled: true
    kms:
      enabled: true
    cognito:
      enabled: true
    stepfunctions:
      enabled: true
      allow-plaintext-http: true
    cloudformation:
      enabled: true
    acm:
      enabled: true
      validation-wait-seconds: 0
    acm-pca:
      enabled: true
    athena:
      enabled: true
      mock: true
    glue:
      enabled: true
    ses:
      enabled: true
    opensearch:
      enabled: true
      mock: true
      proxy-base-port: 9400
      proxy-max-port: 9499
    ec2:
      enabled: true
      imds-port: 9169
      ssh-port-range-start: 2200
      ssh-port-range-end: 2299
      publish-security-group-ports: true
      app-port-range-start: 30000
      app-port-range-end: 30999
      max-published-ports-per-instance: 20
      socat-image: alpine/socat
      mock: true
    ecs:
      enabled: true
      mock: true
    appconfig:
      enabled: true
    appconfigdata:
      enabled: true
    ecr:
      enabled: true
    ui:
      enabled: true
    bedrock-runtime:
      enabled: true
    bedrock-agent:
      enabled: true
    bedrock-agent-core:
      enabled: true
    bedrock-data-automation:
      enabled: true
    eks:
      enabled: true
      mock: true
      ecr-registry-mirror: true
    mwaa:
      enabled: true
      mock: true
    pipes:
      enabled: true
    elbv2:
      enabled: true
      mock: true
    codebuild:
      enabled: true
      # docker-network: floci-network
    batch:
      enabled: true
      runner-mode: immediate
      immediate-complete: true
    codedeploy:
      enabled: true
    codepipeline:
      enabled: true
    codeconnections:
      enabled: true
    autoscaling:
      enabled: true
    applicationautoscaling:
      enabled: true
    elasticbeanstalk:
      enabled: true
    transfer:
      enabled: true
    backup:
      enabled: true
      job-completion-delay-seconds: 1
    backupsearch:
      enabled: true
    databrew:
      enabled: true
    dlm:
      enabled: true
    route53:
      enabled: true
    textract:
      enabled: true
    comprehend:
      enabled: true
    comprehendmedical:
      enabled: true
    pricing:
      enabled: true
    ce:
      enabled: true
    cur:
      enabled: true
      emit-mode: off
    bcm-data-exports:
      enabled: true
      emit-mode: off
    budgets:
      enabled: true
    cloudtrail:
      enabled: true
    cloudhsm-v2:
      enabled: true
    lightsail:
    cloudcontrol:
      enabled: true
    cloudfront:
      enabled: true
      function-runtime-command: node
    appsync:
      enabled: true
      schema-worker-threads: 4
      schema-worker-shutdown-timeout-seconds: 30
    s3vectors:
      enabled: true
    iot:
      enabled: true
      mqtt:
        enabled: true
        auto-start: false
        host: 127.0.0.1
        port: 1883
    iotdata:
      enabled: true
    rum:
      enabled: true
    amp:
      enabled: true
    aiops:
      enabled: true
    account:
      enabled: true
    accessanalyzer:
      enabled: true
    auditmanager:
      enabled: true
    amplify:
      enabled: true
    appflow:
      enabled: true
    appintegrations:
      enabled: true
    appregistry:
      enabled: true
    apprunner:
      enabled: true
    b2bi:
      enabled: true
    chatbot:
      enabled: true
    controltower:
      enabled: true
    codeartifact:
      enabled: true
    application-signals:
      enabled: true
